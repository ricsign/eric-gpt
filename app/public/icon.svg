<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#08080A"/>
  <!-- The control itself, as the mark: filled blocks stopping short of the end.
       The gap is the point — it is what every call is about. -->
  <g fill="#C6F24E">
    <rect x="72" y="150" width="46" height="212"/>
    <rect x="136" y="150" width="46" height="212"/>
    <rect x="200" y="150" width="46" height="212"/>
    <rect x="264" y="150" width="46" height="212"/>
  </g>
  <g fill="#FFFFFF" opacity="0.16">
    <rect x="328" y="150" width="46" height="212"/>
    <rect x="392" y="150" width="46" height="212"/>
  </g>
</svg>
