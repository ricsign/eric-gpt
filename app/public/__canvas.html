<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="/src/styles/fonts.css">
<link rel="stylesheet" href="/src/styles/tokens.css">
<style>body{background:#333;display:flex;gap:20px;padding:20px}img{height:820px;outline:1px solid #555}</style>
</head><body>
<script type="module">
import { renderReceipt, STORY, SQUARE } from '/src/lib/receipt.ts'
const input = {
  callNo: 13, date: 'SEP 13',
  title: 'Your boss pays 50c for every dollar you save.',
  verdict: 'short', value: 3, unit: '%',
  breakdown: [
    { label: 'PAY', value: '$62,000' },
    { label: 'YOUR COST', value: '$155/mo' },
    { label: 'MATCH CAPTURED', value: '$930' },
    { label: 'LEFT ON THE TABLE', value: '$930', emphasis: true },
    { label: 'INSTANT RETURN', value: '50%' },
  ],
  at65: 412900, delta: -188400,
}
for (const size of [STORY, SQUARE]) {
  const blob = await renderReceipt(input, size)
  const img = document.createElement('img')
  img.src = URL.createObjectURL(blob)
  await img.decode()
  document.body.append(img)
}
document.title = 'done'
</script></body></html>
