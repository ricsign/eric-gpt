<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!--
      viewport-fit=cover so the page paints under the notch and home indicator
      and env(safe-area-inset-*) becomes non-zero. interactive-widget so the
      keyboard resizes the viewport instead of scrolling the layout away.
      Pinch-zoom is left enabled; focus-zoom is prevented the accessible way,
      with >=16px controls.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />

    <title>Napkin — ten money questions, one a day</title>
    <meta
      name="description"
      content="Ten money questions, one a day. You guess the number, we show you the real one, what most people guess, and the one thing to do about it. A minute each, no sign-up."
    />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Napkin" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#08080A" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Napkin — ten money questions, one a day" />
    <meta
      property="og:description"
      content="Guess the number, then see the real one. Ten questions that decide most of what an ordinary household ends up with."
    />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Preload the two faces that appear above the fold. The display face sets the
      headline and the data face sets every figure; without these the first paint
      shows a system fallback and then reflows the hero number, which is the most
      visible possible way to look like a web page.
    -->
    <link rel="preload" href="/fonts/archivo-black-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/courier-prime-400.woff2" as="font" type="font/woff2" crossorigin />

    <style>
      /* First paint, before any CSS module loads: the shell colour, so the app
         never flashes white on a dark product. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #08080a;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
